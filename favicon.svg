<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#1a73e8"/>
  <!-- Graduation Cap -->
  <g fill="white" transform="translate(32,30)">
    <!-- Cap top (diamond) -->
    <polygon points="0,-14 22,0 0,8 -22,0" fill="white"/>
    <!-- Cap base -->
    <rect x="-12" y="2" width="24" height="3" rx="1" fill="white"/>
    <!-- Tassel -->
    <line x1="18" y1="0" x2="22" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <circle cx="22" cy="14" r="2.5" fill="white"/>
  </g>
</svg>